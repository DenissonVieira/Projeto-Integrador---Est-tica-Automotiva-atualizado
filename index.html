<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da Clínica</title>

<style>
:root {
    --primary: #2563eb;
    --bg: #f8fafc;
    --surface: #ffffff;
    --text: #1e293b;
}

body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2rem;
    display: flex;
    justify-content: center;
}

.container {
    background: var(--surface);
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    max-width: 700px;
    width: 100%;
}
h1 { margin-top: 0; color: var(--primary); }
.section { margin-bottom: 25px; }
input {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #94a3b8;
    width: 100%;
}
.row { display: flex; gap: 10px; margin-bottom: 10px; }
button {
    background-color: var(--primary);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
}
button:hover { opacity: 0.9; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#desafio-btn { grid-column: span 2; background: #059669; padding: 14px; }
.resultado {
    background: #f1f5f9;
    padding: 15px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    min-height: 120px;
    white-space: pre-wrap;
    font-family: monospace;
}
</style>
</head>

<body>

<div class="container">

<h1>Dashboard Clínica</h1>

<!-- 🩺 REGISTRO -->
<div class="section">
    <h3>🩺 Novo Atendimento</h3>
    <div class="row">
        <input type="text" id="nome" placeholder="Nome do paciente">
        <input type="text" id="sintoma" placeholder="Sintoma">
    </div>
    <button onclick="registrarAtendimento()">Salvar Atendimento</button>
</div>

<!-- 📊 CONSULTAS -->
<div class="section">
    <h3>📊 Consultas</h3>
    <div class="grid">
        <button onclick="fetchData('etapa6')">JOIN Básico</button>
        <button onclick="fetchData('etapa7')">JOIN Completo</button>
        <button onclick="fetchData('etapa8')">Pacientes com Febre</button>
        <button onclick="fetchData('etapa9')">Total por Paciente</button>
        <button id="desafio-btn" onclick="fetchData('etapa10')">🚀 Sintoma Mais Frequente</button>


        <!-- Novos botões -->
        <button onclick="atualizarPaciente()">✏️ Atualizar Paciente</button>
        <button onclick="deletarPaciente()">🗑️ Deletar Paciente</button>
    </div>
</div>


<!-- RESULTADO -->
<div class="section">
    <h3>Resultado</h3>
    <div id="resultado" class="resultado">Aguardando ação...</div>
</div>

</div>



<script>


const token = localStorage.getItem("token");
if (!token) {
  alert("Faça login primeiro!");
  window.location.href = "login.html";
}


const API_URL = 'http://localhost:3000/api';

// 🔑 LOGIN
async function login() {
    const usuario = document.getElementById('usuario').value;
    const senha = document.getElementById('senha').value;
    const box = document.getElementById('resultado');

    try {
        const res = await fetch("http://localhost:3000/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ usuario, senha })
        });

        const data = await res.json();

        if (data.token) {
            // guarda o token no navegador
            localStorage.setItem("token", data.token);

            box.innerHTML = "✅ Login realizado. Redirecionando...";

            // redireciona para o painel
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1000);
        } else {
            box.innerHTML = "❌ Credenciais inválidas.";
        }
    } catch {
        box.innerHTML = "Erro ao conectar com API de login.";
    }
}

// ✏️ Atualizar paciente (exemplo: id=1)
async function atualizarPaciente() {
    const box = document.getElementById('resultado');
    box.innerHTML = "Atualizando paciente...";
    try {
        const response = await fetch("http://localhost:3000/pacientes/1", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ nome: "Paciente Atualizado", idade: 40 })
        });
        const data = await response.json();
        box.innerHTML = JSON.stringify(data, null, 2);
    } catch {
        box.innerHTML = "Erro ao atualizar paciente.";
    }
}

// 🗑️ Deletar paciente (exemplo: id=1)
async function deletarPaciente() {
    const box = document.getElementById('resultado');
    box.innerHTML = "Deletando paciente...";
    try {
        const response = await fetch("http://localhost:3000/pacientes/1", {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await response.json();
        box.innerHTML = JSON.stringify(data, null, 2);
    } catch {
        box.innerHTML = "Erro ao deletar paciente.";
    }
}

// GET
async function fetchData(endpoint) {
    const box = document.getElementById('resultado');
    box.innerHTML = "Carregando...";

    try {
        const response = await fetch(`${API_URL}/${endpoint}`, {
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await response.json();

        if (endpoint === 'etapa10') {
            box.innerHTML = `🏆 Sintoma mais frequente: ${data.descricao}\n📊 Frequência: ${data.frequencia}`;
        } else {
            box.innerHTML = JSON.stringify(data, null, 2);
        }
    } catch {
        box.innerHTML = "Erro ao conectar com a API.";
    }
}

// POST
async function registrarAtendimento() {
    const nome = document.getElementById('nome').value;
    const sintoma = document.getElementById('sintoma').value;
    const box = document.getElementById('resultado');

    if (!nome || !sintoma) {
        box.innerHTML = "Preencha nome e sintoma!";
        return;
    }

    try {
        const response = await fetch(`${API_URL}/atendimento`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': "Bearer " + token
            },
            body: JSON.stringify({ nome, sintoma })
        });

        const data = await response.json();
        box.innerHTML = `✅ ${data.message}\nPaciente: ${data.paciente}\nSintoma: ${data.sintoma}`;
    } catch {
        box.innerHTML = "Erro ao salvar atendimento.";
    }
}
</script>

</body>
</html>
