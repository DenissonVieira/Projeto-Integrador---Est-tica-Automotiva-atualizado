<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login Reluz</title>
<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background:#101215;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.container {
  background:#2b2f35;
  padding:2rem;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  width:300px;
}
h2 { text-align:center; color:#e8a23a; }
input, button {
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
  border:1px solid #ccc;
}
button {
  background:#e8a23a;
  color:#060606;
  font-weight:bold;
  cursor:pointer;
}
button:hover { opacity:0.9; }
#resultado { margin-top:10px; font-size:0.9rem; }
</style>
</head>
<body>
<div class="container">
  <h2>🔐 Login</h2>
  <input type="text" id="usuario" placeholder="Usuário">
  <input type="password" id="senha" placeholder="Senha">
  <button onclick="login()">Entrar</button>
  <div id="resultado"></div>
</div>

<script>
// 🔑 LOGIN
async function login() {
    const usuario = document.getElementById('usuario').value;
    const senha = document.getElementById('senha').value;
    const box = document.getElementById('resultado');

    try {
        const res = await fetch("http://localhost:3000/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ usuario, senha })
        });

        const data = await res.json();

        if (data.token) {
            // guarda o token no navegador
            localStorage.setItem("token", data.token);

            box.innerHTML = "✅ Login realizado. Redirecionando...";

            // redireciona para o painel
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1000);
        } else {
            box.innerHTML = "❌ Credenciais inválidas.";
        }
    } catch {
        box.innerHTML = "Erro ao conectar com API de login.";
    }
}
</script>
</body>
</html>
